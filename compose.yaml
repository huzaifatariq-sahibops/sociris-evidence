services:
  app:
    build:
      context: ./app
    image: sociris-evidence-app:local
    environment:
      HOST: 0.0.0.0
      PORT: "8004"
      DATABASE_PATH: /data/app.db
    volumes:
      - app-data:/data
    expose:
      - "8004"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - backend

  proxy:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend
      - backend

volumes:
  app-data:

networks:
  frontend:
  backend:
    internal: true
