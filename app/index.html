<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Day 4 Application</title>
</head>
<body>
  <h1>Day 4 Software Application</h1>
  <p>This HTML page is the frontend.</p>
  <p id="result">Contacting the backend...</p>
  <script>
    fetch('/api/visits')
      .then(response => response.json())
      .then(data => {
        document.querySelector('#result').textContent =
          `Database visit count: ${data.visits}`;
      });
  </script>
</body>
</html>
